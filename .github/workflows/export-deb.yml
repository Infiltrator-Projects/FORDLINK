name: Export FORDLINK Debian package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p export cpack
          cpack --config build/CPackConfig.cmake -G DEB -B cpack
          SRC="$(find cpack -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$SRC"
          test "$(dpkg-deb -f "$SRC" Package)" = "fordlink"
          test "$(dpkg-deb -f "$SRC" Version)" = "$VERSION"
          install -m 0644 "$SRC" "export/FORDLINK-$VERSION-linux-amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-deb-export
          path: export/*.deb
          if-no-files-found: error
          compression-level: 0
