# SPDX-License-Identifier: GPL-3.0-or-later
name: FORDLINK CI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - name: Verify exact LINK pin
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/link)" = "a945483748544ed209b78c8c1259fe9ad17e8101"
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "0.14.67"
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
