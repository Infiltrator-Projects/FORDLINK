# SPDX-License-Identifier: GPL-3.0-or-later
name: FORDLINK Release
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  linux:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DFORDLINK_BUILD_LINUX_GUI=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Package GUI DEB
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release cpack
          cpack --config build-linux/CPackConfig.cmake -G DEB -B cpack
          src="$(find cpack -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$src"
          dpkg-deb -c "$src" | grep -F './usr/bin/fordlink' >/dev/null
          dpkg-deb -c "$src" | grep -F './usr/share/applications/fordlink.desktop' >/dev/null
          install -m 0644 "$src" "release/FORDLINK-$VERSION-linux-amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-linux
          path: release/*

  windows:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - id: version
        shell: pwsh
        run: '"version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - run: cmake -S . -B build-win32 -A Win32 -DFORDLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-win32 --config Release --target fordlink-discover --parallel
      - name: Prove and stage EXE
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/fordlink-discover.exe' -ExpectedTitle 'FORDLINK Discover'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item 'build-win32/Release/fordlink-discover.exe' "release/FORDLINK-${{ steps.version.outputs.version }}-windows-discover.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-windows
          path: release/*

  iphone:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build unsigned IPA
        run: bash scripts/build-ios-ipa.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-iphone
          path: ${{ runner.temp }}/release/*

  publish:
    name: Publish complete GUI release
    needs: [linux, windows, iphone]
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: FORDLINK-*
          path: release
          merge-multiple: true
      - name: Verify GUI artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/FORDLINK-$VERSION-linux-amd64.deb"
          test -s "release/FORDLINK-$VERSION-windows-discover.exe"
          test -s "release/FORDLINK-$VERSION-unsigned.ipa"
          (cd release && sha256sum FORDLINK-* > SHA256SUMS.txt)
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; releases are immutable" >&2
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "FORDLINK $VERSION" \
            --notes "FORDLINK $VERSION replaces the CLI skeleton with real GUI applications on Linux, Windows and iPhone, all using the shared LINK standards diagnostic core." \
            release/*
