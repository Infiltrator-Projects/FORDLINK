# SPDX-License-Identifier: GPL-3.0-or-later
name: FORDLINK Release
on:
  workflow_run:
    workflows: ["FORDLINK CI"]
    types: [completed]
permissions:
  contents: read

jobs:
  linux:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libgtk-4-dev libbluetooth-dev libusb-1.0-0-dev pkg-config
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - run: cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DFORDLINK_BUILD_LINUX_GUI=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-linux --parallel
      - name: Package GUI DEB
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release cpack
          cpack --config build-linux/CPackConfig.cmake -G DEB -B cpack
          src="$(find cpack -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$src"
          dpkg-deb -c "$src" | grep -F './usr/bin/fordlink' >/dev/null
          dpkg-deb -c "$src" | grep -F './usr/share/applications/fordlink.desktop' >/dev/null
          install -m 0644 "$src" "release/FORDLINK-$VERSION-linux-amd64.deb"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-linux
          path: release/*

  windows:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - id: version
        shell: pwsh
        run: '"version=$((Get-Content VERSION -Raw).Trim())" >> $env:GITHUB_OUTPUT'
      - run: cmake -S . -B build-win32 -A Win32 -DFORDLINK_BUILD_WINDOWS_DISCOVER=ON -DBUILD_TESTING=OFF
      - run: cmake --build build-win32 --config Release --target fordlink-discover --parallel
      - name: Prove and stage EXE
        shell: pwsh
        run: |
          & 'src/link/platform/windows/smoke-launch.ps1' -Executable 'build-win32/Release/fordlink-discover.exe' -ExpectedTitle 'FORDLINK Discover'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item 'build-win32/Release/fordlink-discover.exe' "release/FORDLINK-${{ steps.version.outputs.version }}-windows-discover.exe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-windows
          path: release/*

  iphone:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          submodules: recursive
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build unsigned IPA
        run: bash scripts/build-ios-ipa.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: FORDLINK-iphone
          path: ${{ runner.temp }}/release/*

  publish:
    name: Publish complete GUI release
    needs: [linux, windows, iphone]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: FORDLINK-*
          path: release
          merge-multiple: true
      - name: Verify GUI artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "release/FORDLINK-$VERSION-linux-amd64.deb"
          test -s "release/FORDLINK-$VERSION-windows-discover.exe"
          test -s "release/FORDLINK-$VERSION-unsigned.ipa"
          test "$(dpkg-deb -f "release/FORDLINK-$VERSION-linux-amd64.deb" Package)" = fordlink
          test "$(dpkg-deb -f "release/FORDLINK-$VERSION-linux-amd64.deb" Version)" = "$VERSION"
          (cd release && sha256sum FORDLINK-* > SHA256SUMS.txt)
          tag="v$VERSION"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; releases are immutable" >&2
            exit 1
          fi
          gh release create "$tag" --target "$EXPECTED_SHA" --title "FORDLINK $VERSION" \
            --notes "FORDLINK $VERSION consumes its pinned LINK release for shared diagnostics, language/unit capabilities, fault-scan state and common product surfaces, while retaining FORDLINK-owned Ford network/module discovery and manufacturer-specific capability layers." \
            release/*

      - name: Refresh and verify Infiltrator APT repository
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
          APP_ID: fordlink
        shell: bash
        run: |
          set -euo pipefail
          dispatch_accepted=false
          if [[ -n "${DISPATCH_TOKEN:-}" ]]; then
            if GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST \
              repos/Infiltrator-Projects/Infiltrator-Repository/dispatches \
              -f event_type='application-release' \
              -f "client_payload[repository]=$GITHUB_REPOSITORY" \
              -f "client_payload[sha]=$RELEASE_SHA" >/dev/null; then
              dispatch_accepted=true
            else
              echo "::warning::Immediate APT dispatch failed; the repository's scheduled safety refresh will publish the release asynchronously."
            fi
          else
            echo "::warning::Immediate APT dispatch token is unavailable; the repository's scheduled safety refresh will publish the release asynchronously."
          fi

          catalogue='https://infiltrator-projects.github.io/Infiltrator-Repository/catalogue/apps.json'
          for attempt in $(seq 1 72); do
            if curl -fsS --retry 2 --retry-delay 1 "$catalogue?release=$RELEASE_SHA&attempt=$attempt" \
              | python3 -c 'import json,sys; app=sys.argv[1]; version=sys.argv[2]; data=json.load(sys.stdin); raise SystemExit(0 if any(item.get("id") == app and str(item.get("version")) == version for item in data) else 1)' "$APP_ID" "$VERSION"; then
              echo "APT repository advertises $APP_ID $VERSION."
              exit 0
            fi
            echo "Waiting for APT publication of $APP_ID $VERSION ($attempt/72)..."
            sleep 10
          done

          if [[ "$dispatch_accepted" == true ]]; then
            echo "::error::Immediate APT dispatch was accepted, but APT did not advertise $APP_ID $VERSION within 12 minutes."
            exit 1
          fi

          echo "::warning::GitHub release $VERSION is published and verified; APT publication is pending the asynchronous scheduled safety refresh."
          exit 0
