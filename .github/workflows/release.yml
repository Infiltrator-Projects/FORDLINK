# SPDX-License-Identifier: GPL-3.0-or-later
name: FORDLINK Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse HEAD:src/link)" = "a945483748544ed209b78c8c1259fe9ad17e8101"
          test "$(tr -d '[:space:]' < src/link/VERSION)" = "0.14.67"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build and verify Debian package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release cpack
          cpack --config build/CPackConfig.cmake -G DEB -B cpack
          SRC="$(find cpack -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$SRC"
          test "$(dpkg-deb -f "$SRC" Package)" = "fordlink"
          test "$(dpkg-deb -f "$SRC" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$SRC" Architecture)" = "amd64"
          dpkg-deb -c "$SRC" | grep -F "./usr/bin/fordlink" >/dev/null
          install -m 0644 "$SRC" "release/FORDLINK-$VERSION-linux-amd64.deb"
          sha256sum "release/FORDLINK-$VERSION-linux-amd64.deb" > release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; published releases are immutable" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          FORDLINK $VERSION is the first package-bearing generic diagnostic release.

          It inherits the LINK 0.14.67 standards stack: SAE OBD-II/J1979, generic DTC knowledge, OBDonUDS, ELM327, ISO-TP, UDS, DoIP, read-only discovery safety, parameter scheduling and telemetry foundations.

          Ford-specific proprietary coverage is intentionally not claimed yet.
          EOF
          gh release create "$TAG"             --target "$GITHUB_SHA"             --title "FORDLINK $VERSION"             --notes-file release-notes.md             "release/FORDLINK-$VERSION-linux-amd64.deb"             "release/SHA256SUMS.txt"
